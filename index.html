
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人部落格</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: #f1f5f9;
            color: #334155;
            line-height: 1.8;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #334155);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 16px;
            background: white;
        }

        nav a {
            color: #334155;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #0d9488;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        }

        .card h2 {
            color: #0f766e;
            margin-bottom: 15px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .links a {
            background: #0f766e;
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .links a:hover {
            background: #115e59;
            transform: translateY(-2px);
        }

        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>我的個人部落格</h1>
        <p>記錄生活、學習與成長</p>
    </header>

    <nav>
        <a href="#about">關於我</a>
        <a href="#articles">我的文章</a>
        <a href="#contact">聯絡我</a>
    </nav>

    <main>
        <section id="about" class="card">
            <h2>關於我</h2>
            <p>你好！歡迎來到我的個人部落格。</p>
            <p>我會在這裡分享程式學習、資安研究與生活心得。</p>

            <div class="links">
                <a href="https://github.com/fire9681"
                   target="_blank"
                   rel="noopener noreferrer">GitHub</a>

                <a href="https://www.facebook.com/jerry.huang.54379236/?locale=zh_TW"
                   target="_blank"
                   rel="noopener noreferrer">Facebook</a>

                <a href="mailto:firefire9681@email.com">Email</a>
            </div>
        </section>

        <section id="articles" class="card">
            <h2>我的文章</h2>
            <p>目前還沒有文章，之後會在這裡分享學習紀錄。</p>
        </section>

        <section id="contact" class="card">
            <h2>聯絡我</h2>
            <p>歡迎透過 Email 與我交流。</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 我的個人部落格</p>
    </footer>

</body>
</html>
